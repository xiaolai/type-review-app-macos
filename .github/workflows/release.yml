name: Release

# Pushing a v* tag is the whole trigger. Nothing publishes on a branch push:
# a release is a deliberate act and a tag is the smallest way to say so.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# The tap is a shared repository and this job rewrites it. Two releases running
# at once could finish out of order and leave the older one's cask in place,
# pushing every `brew upgrade` user backwards. Not cancel-in-progress: a run
# that has already pushed must be allowed to finish rather than be killed
# mid-mutation. Both lessons come from xiaolai/vmark, which learned them the
# expensive way.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    # arm64. `make` builds for the machine it runs on and there is no universal
    # binary, so the runner's architecture *is* the release's architecture.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Check the tag against Info.plist
        # A tag that disagrees with the version in the tree would publish an
        # asset whose name and contents say different things, and the cask
        # below would then be written from the wrong one.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          plist=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [ "$tag" != "$plist" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Info.plist $plist"
            exit 1
          fi
          echo "version=$plist" >> "$GITHUB_ENV"

      - name: Import the signing certificate
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # A throwaway keychain, so nothing is left on the runner's default
          # one and the password is generated rather than carried in a secret.
          pass=$(uuidgen)
          security create-keychain -p "$pass" build.keychain
          security set-keychain-settings -lut 900 build.keychain
          security unlock-keychain -p "$pass" build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f /tmp/cert.p12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" build.keychain
          # Prove it landed. `security import` reports success for a file that
          # produced no usable identity, and the failure would otherwise
          # surface as a confusing codesign error much later.
          security find-identity -v -p codesigning build.keychain | grep -q "Developer ID Application" \
            || { echo "::error::no Developer ID identity after import"; exit 1; }

      - name: Build, notarise, staple, zip
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          make release NOTARY_AUTH="--apple-id $NOTARY_APPLE_ID --password $NOTARY_PASSWORD --team-id $NOTARY_TEAM_ID"

      - name: Verify what is about to be published
        # The same questions a user's Mac will ask, asked before the artefact
        # is public rather than after.
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          ditto -x -k "dist/TYPE-${version}-direct.zip" "$work"
          spctl -a -vvv "$work/TYPE.app"
          xcrun stapler validate "$work/TYPE.app"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/TYPE-${version}-direct.zip" \
            --title "TYPE ${version}" --generate-notes

      - name: Update the Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          gh repo clone xiaolai/homebrew-tap /tmp/tap -- --depth 1
          cask=/tmp/tap/Casks/type-review.rb

          # Refuse to go backwards. A misfired run with an old tag would
          # otherwise publish a cask older than the one already there, and
          # every `brew upgrade` would walk users back a version.
          current=$(grep '^  version "' "$cask" | head -1 | awk -F'"' '{print $2}')
          if [ -n "$current" ]; then
            if [ "$version" = "$current" ]; then
              echo "::error::the tap is already at $current"; exit 1
            fi
            newest=$(printf '%s\n%s\n' "$version" "$current" | sort -V | tail -1)
            if [ "$newest" != "$version" ]; then
              echo "::error::the tap is at $current, newer than $version — refusing to downgrade"
              exit 1
            fi
            echo "tap at $current, publishing $version"
          fi

          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/TYPE-${version}-direct.zip"

          # Wait for the asset to be reachable. `gh release create` returns
          # before the download URL is necessarily serving, and hashing a 404
          # would publish a checksum no user could ever match.
          for i in $(seq 1 30); do
            code=$(curl -sI -o /dev/null -w "%{http_code}" -L "$url")
            [ "$code" = "200" ] && break
            echo "attempt $i/30: HTTP $code, waiting"
            sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::asset never became available"; exit 1; }

          # --fail-with-body, not -f: curl refuses both together, and plain
          # `curl -L` writes an error page to the output file and exits 0 --
          # which is how an error page once got hashed and shipped as a cask's
          # checksum. Then two sanity checks, because a 200 carrying the wrong
          # bytes exits 0 as well.
          curl -L --fail-with-body --retry 3 --retry-delay 5 --retry-all-errors \
            -o /tmp/published.zip "$url"
          size=$(stat -f%z /tmp/published.zip)
          [ "$size" -gt 1000000 ] || { echo "::error::asset is only $size bytes"; exit 1; }
          file /tmp/published.zip | grep -qi zip || { echo "::error::asset is not a zip"; exit 1; }
          sha=$(shasum -a 256 /tmp/published.zip | cut -d' ' -f1)

          # Written whole rather than patched in place. `sed` reports success
          # when its pattern matched nothing, which is exactly how a cask keeps
          # pointing at the previous release while the run goes green.
          cat > "$cask" <<RUBY
          cask "type-review" do
            version "${version}"
            sha256 "${sha}"

            url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/TYPE-#{version}-direct.zip"
            name "TYPE"
            desc "Typing practice that adapts to the keys you miss"
            homepage "https://type.review"

            livecheck do
              url :url
              strategy :github_latest
            end

            # arm64 only. There is no universal binary: \`make\` builds for the
            # machine it runs on, and releases are cut on Apple silicon.
            depends_on arch: :arm64
            depends_on macos: :sonoma

            app "TYPE.app"

            # The direct build's identifier. The Mac App Store build carries
            # \`review.type.app\` and its own container, so uninstalling this one
            # must not reach into the other's data.
            zap trash: [
              "~/Library/Application Support/review.type.app.direct",
              "~/Library/Caches/review.type.app.direct",
              "~/Library/HTTPStorages/review.type.app.direct",
              "~/Library/Preferences/review.type.app.direct.plist",
              "~/Library/Saved Application State/review.type.app.direct.savedState",
            ]
          end
          RUBY

          ruby -c "$cask"
          grep -q "version \"${version}\"" "$cask" || { echo "::error::version not written"; exit 1; }
          grep -q "sha256 \"${sha}\"" "$cask" || { echo "::error::sha256 not written"; exit 1; }

          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "type-review ${version}"
          git push
